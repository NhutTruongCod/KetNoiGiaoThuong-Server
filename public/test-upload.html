<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Upload Avatar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"],
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        img {
            max-width: 200px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Test Upload Avatar</h1>
    
    <div class="form-group">
        <label>Email:</label>
        <input type="text" id="email" value="admin@tradehub.com">
    </div>
    
    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="password" value="admin123">
    </div>
    
    <div class="form-group">
        <button onclick="login()">1. Login</button>
    </div>
    
    <hr>
    
    <div class="form-group">
        <label>Chọn ảnh avatar:</label>
        <input type="file" id="avatar" accept="image/*">
    </div>
    
    <div class="form-group">
        <button onclick="uploadAvatar()">2. Upload Avatar</button>
    </div>
    
    <div id="result"></div>

    <script>
        let token = '';
        const API_URL = 'http://127.0.0.1:8000/api';

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    token = data.data.access_token;
                    showResult('success', `✅ Login thành công! Token: ${token.substring(0, 50)}...`);
                } else {
                    showResult('error', `❌ Login thất bại: ${data.message}`);
                }
            } catch (error) {
                showResult('error', `❌ Lỗi: ${error.message}`);
            }
        }

        async function uploadAvatar() {
            if (!token) {
                showResult('error', '❌ Vui lòng login trước!');
                return;
            }
            
            const fileInput = document.getElementById('avatar');
            const file = fileInput.files[0];
            
            if (!file) {
                showResult('error', '❌ Vui lòng chọn file!');
                return;
            }
            
            // Tạo FormData
            const formData = new FormData();
            formData.append('avatar', file, file.name);
            
            console.log('Uploading file:', file.name, file.type, file.size);
            console.log('FormData entries:', Array.from(formData.entries()));
            
            try {
                const response = await fetch(`${API_URL}/user/avatar`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                        // KHÔNG set Content-Type khi dùng FormData!
                    },
                    body: formData
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (data.status === 'success') {
                    showResult('success', `
                        ✅ Upload thành công!<br>
                        📸 URL: ${data.data.avatar_url}<br>
                        📁 Filename: ${data.data.filename}<br>
                        📊 Size: ${data.data.size} bytes<br>
                        🎨 Type: ${data.data.mime_type}<br>
                        <img src="${data.data.avatar_url}" alt="Avatar">
                    `);
                } else {
                    showResult('error', `❌ Upload thất bại: ${data.message}<br>Debug: ${JSON.stringify(data.debug || {})}<br>Errors: ${JSON.stringify(data.errors || {})}`);
                }
            } catch (error) {
                showResult('error', `❌ Lỗi: ${error.message}`);
            }
        }

        function showResult(type, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
        }
    </script>
</body>
</html>
